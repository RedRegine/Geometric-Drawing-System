plugins {
    id 'java'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    // JLFGR: Java Look and Feel Grafik Repository (Symbolleiste)
    implementation files('resources/jlfgr-1_0.jar')

    // JUnit 6: gemeinsame Versionsverwaltung
    testImplementation platform('org.junit:junit-bom:6.0.0')

    // JUnit Jupiter: normale Tests und Test-Lebenszyklus
    testImplementation 'org.junit.jupiter:junit-jupiter'

    // JUnit Jupiter Params: Unterstützung für parametrisierte Tests
    testImplementation 'org.junit.jupiter:junit-jupiter-params'

    // JUnit Platform Launcher: Ausführung der Tests
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    // Verwendet die JUnit Platform zur Ausführung der Tests
    useJUnitPlatform()
}